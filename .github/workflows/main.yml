name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies & lint
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip install flake8
          # We just check for fatal syntax errors for now
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics | tee lint_output.log || true
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics | tee -a lint_output.log

      - name: Send Logs to Splunk (Lint Stage)
        if: always()
        run: |
          LOG_CONTENT=$(cat lint_output.log || echo "No linting logs found")
          PAYLOAD=$(jq -n \
            --arg st "cicd_pipeline" \
            --arg p "github_actions" \
            --arg stage "lint" \
            --arg status "${{ job.status }}" \
            --arg repo "${{ github.repository }}" \
            --arg sha "${{ github.sha }}" \
            --arg logs "$LOG_CONTENT" \
            '{sourcetype: $st, event: {pipeline: $p, stage: $stage, status: $status, repository: $repo, commit_sha: $sha, logs: $logs}}')
          
          curl -k -X POST "${{ secrets.SPLUNK_HEC_URI }}" \
            -H "Authorization: Splunk ${{ secrets.SPLUNK_HEC_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Failed to notify Splunk"

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          set -o pipefail
          python -m pytest tests/ -v 2>&1 | tee test_output.log

      - name: Send Logs to Splunk (Test Stage)
        if: always()
        run: |
          LOG_CONTENT=$(cat test_output.log || echo "No test logs found")
          PAYLOAD=$(jq -n \
            --arg st "cicd_pipeline" \
            --arg p "github_actions" \
            --arg stage "test" \
            --arg status "${{ job.status }}" \
            --arg repo "${{ github.repository }}" \
            --arg sha "${{ github.sha }}" \
            --arg logs "$LOG_CONTENT" \
            '{sourcetype: $st, event: {pipeline: $p, stage: $stage, status: $status, repository: $repo, commit_sha: $sha, logs: $logs}}')
          
          curl -k -X POST "${{ secrets.SPLUNK_HEC_URI }}" \
            -H "Authorization: Splunk ${{ secrets.SPLUNK_HEC_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Failed to notify Splunk"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Vercel CLI & UV
        run: |
          npm install --global vercel@latest
          pip install uv

      - name: Vercel Pull, Build, and Deploy
        run: |
          set -o pipefail
          echo "Starting Vercel Pull..." | tee -a vercel_combined.log
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee -a vercel_combined.log
          
          echo -e "\nStarting Vercel Build..." | tee -a vercel_combined.log
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee -a vercel_combined.log
          
          echo -e "\nStarting Vercel Deploy..." | tee -a vercel_combined.log
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee -a vercel_combined.log
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Send Logs to Splunk (Deploy Stage)
        if: always()
        run: |
          LOG_CONTENT=$(cat vercel_combined.log || echo "No deploy logs found")
          PAYLOAD=$(jq -n \
            --arg st "cicd_pipeline" \
            --arg p "github_actions" \
            --arg stage "deploy" \
            --arg status "${{ job.status }}" \
            --arg repo "${{ github.repository }}" \
            --arg sha "${{ github.sha }}" \
            --arg logs "$LOG_CONTENT" \
            '{sourcetype: $st, event: {pipeline: $p, stage: $stage, status: $status, repository: $repo, commit_sha: $sha, logs: $logs}}')
          
          curl -k -X POST "${{ secrets.SPLUNK_HEC_URI }}" \
            -H "Authorization: Splunk ${{ secrets.SPLUNK_HEC_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Failed to notify Splunk"
