name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          pytest tests/ -v

      - name: Notify Splunk - Pipeline Status
        if: always()
        run: |
          STATUS="${{ job.status }}"
          SHA="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"
          
          PAYLOAD=$(cat <<EOF
          {
            "event": {
              "pipeline": "github_actions",
              "repository": "${{ github.repository }}",
              "commit_sha": "$SHA",
              "branch": "$BRANCH",
              "status": "$STATUS",
              "message": "CI Pipeline completed"
            }
          }
          EOF
          )
          
          curl -k -X POST "${{ secrets.SPLUNK_HEC_URI }}" \
            -H "Authorization: Splunk ${{ secrets.SPLUNK_HEC_TOKEN }}" \
            -d "$PAYLOAD" || echo "Failed to notify Splunk HEC."

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Accept: application/json" || echo "Render deploy hook failed."
          
      - name: Notify Splunk - Deployment Initiated
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "event": {
              "pipeline": "github_actions",
              "event_type": "deployment_initiated",
              "target": "render",
              "commit_sha": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}"
            }
          }
          EOF
          )
          
          curl -k -X POST "${{ secrets.SPLUNK_HEC_URI }}" \
            -H "Authorization: Splunk ${{ secrets.SPLUNK_HEC_TOKEN }}" \
            -d "$PAYLOAD" || echo "Failed to notify Splunk HEC about deployment."
